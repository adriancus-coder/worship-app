# Render Blueprint (render.yaml): two services from the same repo, one per branch.
#   worship-app      main   production - the team's installed app (URL and disk stay)
#   worship-app-dev  dev    testing - every change lands here first; dev -> main promotes it
# The production service existed before this file managed it: a Blueprint created from the
# repo adds worship-app-dev; secrets (sync: false) are asked for at creation.
services:
  - type: web
    name: worship-app
    branch: main          # production: the team's installed app (main = dev promoted)
    runtime: node
    # Persistent disks require a paid instance type.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: worship-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      # Set manually in the Render dashboard.
      - key: SETUP_TOKEN
        sync: false
      # Outgoing email (docs/EMAIL.md). Leave both unset to run without email.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Web push (docs/PUSH.md): `npm run vapid` prints the three values. Unset: no push.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Pexels backgrounds (docs/BACKGROUNDS.md). Unset: the tab is hidden.
      - key: PEXELS_API_KEY
        sync: false
      # AI for the Ghiduri (lib/ai.js): drafts and "Întreabă ghidul". Unset: the AI parts are
      # hidden. AI_MONTHLY_CALLS caps the uses per church and month (default 300).
      - key: ANTHROPIC_API_KEY
        sync: false
  - type: web
    name: worship-app-dev
    branch: dev           # testing: where every change lands first
    runtime: node
    # Persistent disks require a paid instance type.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: worship-data-dev
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      # Set manually in the Render dashboard.
      - key: SETUP_TOKEN
        sync: false
      # Outgoing email (docs/EMAIL.md). Leave both unset to run without email.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Web push (docs/PUSH.md): `npm run vapid` prints the three values. Unset: no push.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Pexels backgrounds (docs/BACKGROUNDS.md). Unset: the tab is hidden.
      - key: PEXELS_API_KEY
        sync: false
      # AI for the Ghiduri (lib/ai.js): drafts and "Întreabă ghidul". Unset: the AI parts are
      # hidden. AI_MONTHLY_CALLS caps the uses per church and month (default 300).
      - key: ANTHROPIC_API_KEY
        sync: false
