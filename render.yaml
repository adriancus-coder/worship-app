services:
  - type: web
    name: worship-app
    runtime: node
    # Persistent disks require a paid instance type.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: worship-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      # Set manually in the Render dashboard.
      - key: SETUP_TOKEN
        sync: false
