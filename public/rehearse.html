<!doctype html>
<html lang="{{LANG}}" data-app-name="{{APP_NAME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <title>{{APP_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="rehearse-body" data-shell="events">
  <main class="wide rehearse-page">
    <p class="back"><a id="back-link" href="/events"></a></p>
    <p id="status" class="muted" role="status" aria-live="polite" data-i18n="events.loading"></p>
    <p id="offline-note" class="offline-note" role="status" hidden data-i18n="offline.cachedNote"></p>

    <div id="rehearse" hidden>
      <div class="rehearse-bar">
        <p id="position" class="rehearse-position" aria-live="polite"></p>
        <div class="rehearse-tools">
          <span data-notation-switch></span>
          <button type="button" class="secondary" id="text-only" aria-pressed="false" data-i18n="song.textOnly" hidden></button>
          <button type="button" class="secondary" id="whole-song" data-icon="follow" data-i18n="arrange.readOnlyButton" hidden></button>
          <div class="size-tools" role="group" data-i18n-aria-label="rehearse.textSize">
            <button type="button" class="secondary icon-button" id="text-smaller" data-i18n-aria-label="rehearse.textSmaller"><span aria-hidden="true">A−</span></button>
            <button type="button" class="secondary icon-button" id="text-larger" data-i18n-aria-label="rehearse.textLarger"><span aria-hidden="true">A+</span></button>
          </div>
        </div>
      </div>

      <article id="slide" class="rehearse-slide" tabindex="-1"></article>

      <nav class="rehearse-nav" data-i18n-aria-label="rehearse.navLabel">
        <button type="button" class="secondary" id="prev" data-i18n="rehearse.prev"></button>
        <button type="button" id="next" data-i18n="rehearse.next"></button>
      </nav>
    </div>
  </main>
  <script src="/i18n.js"></script>
  <script src="/chords.js"></script>
  <script src="/sections.js"></script>
  <script src="/page.js"></script>
  <script src="/notation.js"></script>
  <script src="/shell.js"></script>
  <script src="/song-render.js"></script>
  <script src="/event-cache.js"></script>
  <script src="/arrange-sheet.js"></script>
  <script src="/rehearse.js"></script>
</body>
</html>
