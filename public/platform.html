<!doctype html>
<html lang="{{LANG}}" data-app-name="{{APP_NAME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <title data-i18n="platform.pageTitle">{{APP_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-shell="more" class="list-page">
  <main class="wide team-page platform-page">
    <div class="page-head">
      <h1 data-i18n="platform.heading"></h1>
      <button type="button" id="add-church" data-icon="plus" data-i18n="platform.add"></button>
    </div>
    <p class="muted" data-i18n="platform.intro"></p>
    <section class="platform-total" aria-labelledby="total-heading">
      <p id="total-heading" class="storage-used"></p>
      <div class="storage-bar" id="total-bar" aria-hidden="true"><span class="storage-fill" id="total-fill"></span></div>
      <p id="total-hint" class="hint"></p>
    </section>
    <p id="page-message" class="message" role="status" aria-live="polite"></p>
    <div class="team-pane" data-list-pane="platform.heading">
      <p id="status" class="muted pane-state" role="status" aria-live="polite" data-i18n="events.loading"></p>
      <ul id="churches" class="team-list"></ul>
    </div>

    <dialog id="add-dialog" aria-labelledby="add-heading">
      <form id="add-form" method="dialog" novalidate>
        <h2 id="add-heading" data-i18n="platform.addHeading"></h2>
        <label><span data-i18n="platform.nameLabel"></span><input type="text" id="add-name" maxlength="100" autocomplete="off" required></label>
        <label><span data-i18n="platform.ownerNameLabel"></span><input type="text" id="add-owner-name" maxlength="100" autocomplete="off" required></label>
        <label><span data-i18n="platform.ownerEmailLabel"></span><input type="email" id="add-owner-email" maxlength="254" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
        <p class="hint" data-i18n="platform.addHint"></p>
        <p id="add-message" class="message error" role="alert"></p>
        <div class="form-actions">
          <button type="submit" id="add-submit" data-icon="plus" data-i18n="platform.create"></button>
          <button type="button" class="secondary" data-close data-i18n="team.cancel"></button>
        </div>
      </form>
    </dialog>

    <dialog id="quota-dialog" aria-labelledby="quota-heading">
      <form id="quota-form" method="dialog" novalidate>
        <h2 id="quota-heading"></h2>
        <label><span data-i18n="platform.quotaLabel"></span><input type="number" id="quota-mb" min="1" step="1" inputmode="numeric"></label>
        <p id="quota-hint" class="hint"></p>
        <p id="quota-message" class="message error" role="alert"></p>
        <div class="form-actions">
          <button type="submit" id="quota-submit" data-icon="check" data-i18n="team.save"></button>
          <button type="button" class="secondary" data-close data-i18n="team.cancel"></button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-dialog" aria-labelledby="confirm-heading">
      <h2 id="confirm-heading"></h2>
      <p id="confirm-text"></p>
      <p id="confirm-message" class="message error" role="alert"></p>
      <div class="form-actions">
        <button type="button" id="confirm-yes"></button>
        <button type="button" class="secondary" data-close data-i18n="team.cancel"></button>
      </div>
    </dialog>

    <dialog id="result-dialog" class="result-dialog" aria-labelledby="result-heading">
      <h2 id="result-heading"></h2>
      <p class="result-warning" role="alert" data-i18n="team.shownOnce"></p>
      <dl class="result-card">
        <dt data-i18n="team.emailLabel"></dt>
        <dd id="result-email"></dd>
        <dt data-i18n="team.temporaryPassword"></dt>
        <dd id="result-password" class="result-password" translate="no"></dd>
      </dl>
      <button type="button" class="secondary" id="copy-password" data-icon="copy" data-i18n="team.copy"></button>
      <label class="result-message-label"><span data-i18n="team.messageLabel"></span>
        <textarea id="result-message" rows="6" readonly></textarea>
      </label>
      <div class="form-actions">
        <button type="button" id="copy-message" data-icon="copy" data-i18n="team.copyMessage"></button>
        <button type="button" class="secondary" id="share-message" hidden data-icon="publish" data-i18n="team.share"></button>
      </div>
      <p id="copy-status" class="message success" role="status" aria-live="polite"></p>
      <div class="form-actions">
        <button type="button" class="secondary" data-close data-i18n="team.done"></button>
      </div>
    </dialog>
  </main>
  <script src="/i18n.js"></script>
  <script src="/page.js"></script>
  <script src="/list-pane.js"></script>
  <script src="/shell.js"></script>
  <script src="/platform.js"></script>
</body>
</html>
