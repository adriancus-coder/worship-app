<!doctype html>
<html lang="{{LANG}}" data-app-name="{{APP_NAME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <title data-i18n="song.pageTitle">{{APP_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-shell="library">
  <main class="wide">
    <p class="back"><a id="song-back" href="/library" data-i18n="song.back"></a></p>
    <p id="status" class="muted" role="status" aria-live="polite" data-i18n="library.loading"></p>
    <article id="song" hidden>
      <h1 id="song-title"></h1>
      <!-- "Ton: Sol · Schimbă" (public/arrange-sheet.js keyBox): always shown, under the title. -->
      <div id="song-key" class="song-key-row"></div>
      <p id="song-meta" class="muted"></p>
      <!-- the song's themes ("tematică"), each a link to the library filtered by it -->
      <div id="song-themes"></div>
      <!-- "Cum se cântă: V1 · Refren · V2 · Refren" (the song's own order, the default of every
           event): the editors change it in the arrange sheet, everyone sees the flow -->
      <div id="song-order" class="song-order"></div>
      <!-- "Cântată ultima dată: …" + the events it was sung at (GET /api/songs/:id/history) -->
      <details id="song-history" class="song-history" hidden></details>
      <!-- "Negativ": the backing track, played here by everyone; added / removed by the song's
           editors (public/song-audio.js) -->
      <div id="song-audio-box"></div>
      <div class="song-actions">
        <button type="button" id="text-only" class="secondary" aria-pressed="false" data-i18n="song.textOnly"></button>
        <span data-notation-switch></span>
        <a class="button secondary" id="edit-song" hidden data-icon="edit" data-i18n="song.edit"></a>
        <!-- "Tipărește": the song as a PDF (public/song-pdf.js): the share sheet on a phone,
             a download elsewhere; title, key, themes, the lyrics as shown (chords or text) -->
        <button type="button" id="print-song" class="secondary" data-icon="print" data-i18n="song.print"></button>
      </div>
      <div id="sections"></div>
    </article>
  </main>
  <script src="/i18n.js"></script>
  <script src="/chords.js"></script>
  <script src="/sections.js"></script>
  <script src="/page.js"></script>
  <script src="/notation.js"></script>
  <script src="/shell.js"></script>
  <script src="/chord-diagrams.js"></script>
  <script src="/song-render.js"></script>
  <script src="/song-pdf.js"></script>
  <script src="/song-audio.js"></script>
  <script src="/arrange-sheet.js"></script>
  <script src="/key-detect.js"></script>
  <script src="/key-detect-ui.js"></script>
  <script src="/themes-ui.js"></script>
  <script src="/song.js"></script>
</body>
</html>
