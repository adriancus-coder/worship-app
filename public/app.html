<!doctype html>
<html lang="{{LANG}}" data-app-name="{{APP_NAME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <title data-i18n="app.pageTitle">{{APP_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-shell="home">
  <main>
    <h1 data-i18n="app.heading"></h1>
    <p id="whoami" class="muted" data-i18n="app.loading"></p>
    <ul class="app-links" id="app-links" hidden>
      <li><a class="button secondary" href="/screens" id="screens-link" hidden data-i18n="screens.link"></a></li>
      <li><a class="button secondary" href="/media" id="media-link" hidden data-i18n="media.link"></a></li>
      <li><a class="button secondary" href="/settings" id="settings-link" hidden data-i18n="settings.link"></a></li>
    </ul>
    <button type="button" id="logout" class="secondary" data-i18n="app.logout"></button>
  </main>
  <script src="/i18n.js"></script>
  <script src="/shell.js"></script>
  <script src="/app.js"></script>
</body>
</html>
