<!doctype html>
<html lang="{{LANG}}" data-app-name="{{APP_NAME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <title data-i18n="home.pageTitle">{{APP_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-shell="home">
  <main class="wide home-page">
    <h1 class="sr-only" data-i18n="home.heading"></h1>
    <p id="status" class="muted" role="status" aria-live="polite" data-i18n="app.loading"></p>
    <div class="home-layout">
      <div id="now" class="home-now" aria-live="polite">
        <div class="board board-skeleton" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      </div>
      <section id="upcoming-section" class="home-weeks" aria-labelledby="upcoming-heading" hidden>
        <h2 id="upcoming-heading" data-i18n="home.upcomingHeading"></h2>
        <ul id="upcoming" class="weeks-list"></ul>
      </section>
    </div>
    <div id="backup-card"></div>

  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/chords.js"></script>
  <script src="/sections.js"></script>
  <script src="/page.js"></script>
  <script src="/notation.js"></script>
  <script src="/shell.js"></script>
  <script src="/song-render.js"></script>
  <script src="/arrange-sheet.js"></script>
  <script src="/team-card.js"></script>
  <script src="/live-client.js"></script>
  <script src="/clock.js"></script>
  <script src="/live-clock.js"></script>
  <script src="/lyrics-fit.js"></script>
  <script src="/big-lyrics.js"></script>
  <script src="/programme-big.js"></script>
  <script src="/key-popover.js"></script>
  <script src="/app.js"></script>
</body>
</html>
