<!doctype html>
<html lang="{{LANG}}" data-app-name="{{APP_NAME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <title>{{APP_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-shell="more" class="list-page">
  <main class="wide">
    <h1 data-i18n="screens.heading"></h1>
    <p class="muted" data-i18n="screens.intro"></p>

    <!-- The pair form and the screens scroll here; the title stays. -->
    <div class="screens-pane" data-list-pane="screens.heading">
      <form id="pair-form" class="pair-form" novalidate>
        <h2 data-i18n="screens.pairHeading"></h2>
        <p class="hint" data-i18n="screens.pairHint"></p>
        <div class="pair-fields">
          <label><span data-i18n="screens.codeLabel"></span>
            <input type="text" id="pair-code" inputmode="numeric" autocomplete="off" maxlength="7" pattern="\d{3} ?\d{3}" required class="mono code-input">
          </label>
          <label><span data-i18n="screens.nameLabel"></span>
            <input type="text" id="pair-name" maxlength="60" required>
          </label>
        </div>
        <button type="submit" id="pair-submit" data-icon="projector" data-i18n="screens.pairSubmit"></button>
        <p id="pair-message" class="message" role="status" aria-live="polite"></p>
      </form>

      <h2 class="pane-heading list-heading" data-i18n="screens.listHeading"></h2>
      <p id="status" class="muted pane-state" role="status" aria-live="polite" data-i18n="events.loading"></p>
      <ul id="screens" class="screen-list"></ul>
    </div>

    <dialog id="rename-dialog" aria-labelledby="rename-heading">
      <form method="dialog" id="rename-form">
        <h2 id="rename-heading" data-i18n="screens.renameHeading"></h2>
        <label><span data-i18n="screens.nameLabel"></span><input type="text" id="rename-name" maxlength="60" required></label>
        <p id="rename-message" class="message error" role="alert"></p>
        <div class="form-actions">
          <button type="submit" value="save" data-icon="check" data-i18n="screens.renameSave"></button>
          <button type="button" class="secondary" id="rename-cancel" data-i18n="screens.cancel"></button>
        </div>
      </form>
    </dialog>

    <dialog id="revoke-dialog" aria-labelledby="revoke-heading">
      <form method="dialog">
        <h2 id="revoke-heading" data-i18n="screens.revokeHeading"></h2>
        <p id="revoke-text"></p>
        <div class="form-actions">
          <button type="submit" class="danger" value="revoke" data-i18n="screens.revokeConfirm"></button>
          <button type="submit" class="secondary" value="cancel" data-i18n="screens.cancel"></button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="/i18n.js"></script>
  <script src="/page.js"></script>
  <script src="/list-pane.js"></script>
  <script src="/shell.js"></script>
  <script src="/screens.js"></script>
</body>
</html>
