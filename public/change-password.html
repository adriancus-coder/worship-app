<!doctype html>
<html lang="{{LANG}}" data-app-name="{{APP_NAME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <title data-i18n="changePassword.pageTitle">{{APP_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar" id="pending-bar" hidden>
    <div class="lang-switch" role="group" aria-label="Limbă / Language">
      <button type="button" data-lang="ro" lang="ro" aria-pressed="false">RO</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <main>
    <h1 data-i18n="changePassword.heading"></h1>
    <p id="intro" class="muted"></p>

    <form id="password-form" novalidate hidden>
      <input type="email" name="username" id="username" autocomplete="username" hidden>
      <label>
        <span id="current-label"></span>
        <input type="password" id="current" autocomplete="current-password" required>
      </label>
      <label>
        <span data-i18n="changePassword.newLabel"></span>
        <input type="password" id="password" autocomplete="new-password" minlength="10" required aria-describedby="password-hint">
      </label>
      <p class="hint" id="password-hint" data-i18n="changePassword.hint"></p>
      <label>
        <span data-i18n="changePassword.confirmLabel"></span>
        <input type="password" id="confirm" autocomplete="new-password" required>
      </label>
      <p class="message" id="message" role="alert" aria-live="polite"></p>
      <button type="submit" id="submit" data-i18n="changePassword.submit"></button>
    </form>
    <button type="button" class="secondary" id="logout" hidden data-i18n="app.logout"></button>
  </main>
  <script src="/i18n.js"></script>
  <script src="/change-password.js"></script>
</body>
</html>
