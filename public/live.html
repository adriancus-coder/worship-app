<!doctype html>
<html lang="{{LANG}}" data-app-name="{{APP_NAME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <title>{{APP_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="live-body" data-shell="exit">
  <main class="live-page">
    <p id="status" class="muted" role="status" aria-live="polite" data-i18n="events.loading"></p>

    <div id="live" hidden>
      <header class="live-head">
        <div class="live-title">
          <h1 id="event-name"></h1>
          <span id="event-status" class="pill"></span>
        </div>
        <div class="live-meta">
          <p id="presence" class="presence" aria-live="polite"></p>
          <p id="connection" class="connection" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="connection-text"></span></p>
        </div>
        <div class="live-actions">
          <button type="button" id="start-button" hidden data-i18n="live.start"></button>
          <button type="button" class="danger" id="end-button" hidden data-i18n="live.end"></button>
        </div>
        <p id="live-message" class="message" role="status" aria-live="polite"></p>
      </header>
      <div id="emergency-banner" class="emergency-banner" role="alert" hidden>
        <p class="emergency-title" data-i18n="live.emergency.banner"></p>
        <p id="emergency-detail" class="emergency-detail"></p>
        <p><a class="emergency-link" href="/help/emergency" target="_blank" rel="noopener" data-i18n="live.emergency.help"></a></p>
      </div>

      <div class="live-grid">
        <section class="live-current" aria-labelledby="current-heading">
          <h2 id="current-heading" class="sr-only" data-i18n="live.currentHeading"></h2>
          <div class="current-tools"><span data-notation-switch></span></div>
          <div id="current"></div>
          <div class="live-nav" role="group" data-i18n-aria-label="live.navLabel">
            <button type="button" class="secondary" id="prev-button" data-i18n="live.prev"></button>
            <button type="button" id="next-button"></button>
          </div>
          <p class="hint key-hint" data-i18n="live.keyHint"></p>
        </section>

        <section class="live-setlist" aria-labelledby="setlist-heading">
          <h2 id="setlist-heading" data-i18n="live.setlistHeading"></h2>
          <ol id="setlist" class="live-list"></ol>
        </section>

        <aside class="live-info" aria-labelledby="info-heading">
          <section class="projector-panel" aria-labelledby="projector-heading">
            <h2 id="projector-heading" data-i18n="live.projector.heading"></h2>
            <div id="projector-preview" class="projector-preview" role="img" data-i18n-aria-label="live.projector.previewLabel"></div>
            <p id="projector-screens" class="projector-screens"></p>
            <div class="source-buttons" role="group" data-i18n-aria-label="live.projector.sourceLabel">
              <button type="button" class="secondary" data-source="content" aria-pressed="false" data-i18n="live.projector.content"></button>
              <button type="button" class="secondary" data-source="logo" aria-pressed="false" data-i18n="live.projector.logo"></button>
              <button type="button" class="secondary" data-source="black" aria-pressed="false" data-i18n="live.projector.black"></button>
            </div>
            <p class="hint" data-i18n="live.projector.keysHint"></p>
            <div id="video-panel"></div>
            <button type="button" class="secondary" id="open-projector" data-i18n="live.projector.open"></button>
            <p class="hint" id="projector-permission" data-i18n="live.projector.permissionHint"></p>
            <p id="projector-message" class="message" role="status" aria-live="polite"></p>
            <p class="hint"><a class="emergency-link" href="/help/emergency" target="_blank" rel="noopener" data-i18n="live.emergency.prepare"></a></p>
          </section>
          <h2 id="info-heading" data-i18n="live.infoHeading"></h2>
          <div id="info"></div>
        </aside>
      </div>
    </div>

    <dialog id="end-dialog" aria-labelledby="end-heading">
      <form method="dialog">
        <h2 id="end-heading" data-i18n="live.endHeading"></h2>
        <p data-i18n="live.endText"></p>
        <div class="form-actions">
          <button type="submit" class="danger" value="end" data-i18n="live.endConfirm"></button>
          <button type="submit" class="secondary" value="cancel" data-i18n="live.endCancel"></button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/chords.js"></script>
  <script src="/sections.js"></script>
  <script src="/page.js"></script>
  <script src="/notation.js"></script>
  <script src="/shell.js"></script>
  <script src="/song-render.js"></script>
  <script src="/positions.js"></script>
  <script src="/frames.js"></script>
  <script src="/projector-render.js"></script>
  <script src="/event-cache.js"></script>
  <script src="/video-panel.js"></script>
  <script src="/projector-window.js"></script>
  <script src="/live-client.js"></script>
  <script src="/live.js"></script>
</body>
</html>
