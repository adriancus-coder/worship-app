<!doctype html>
<html lang="{{LANG}}" data-app-name="{{APP_NAME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <title>{{APP_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="live-body">
  <header class="topbar">
    <nav class="topnav" data-i18n-aria-label="nav.label">
      <a href="/app" data-i18n="nav.home"></a>
      <a href="/library" data-i18n="nav.library"></a>
      <a href="/events" aria-current="page" data-i18n="nav.events"></a>
    </nav>
    <div class="lang-switch" role="group" aria-label="Limbă / Language">
      <button type="button" data-lang="ro" lang="ro" aria-pressed="false">RO</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <main class="live-page">
    <p class="back"><a id="back-link" href="/events"></a></p>
    <p id="status" class="muted" role="status" aria-live="polite" data-i18n="events.loading"></p>

    <div id="live" hidden>
      <header class="live-head">
        <div class="live-title">
          <h1 id="event-name"></h1>
          <span id="event-status" class="pill"></span>
        </div>
        <div class="live-meta">
          <p id="presence" class="presence" aria-live="polite"></p>
          <p id="connection" class="connection" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="connection-text"></span></p>
        </div>
        <div class="live-actions">
          <button type="button" id="start-button" hidden data-i18n="live.start"></button>
          <button type="button" class="danger" id="end-button" hidden data-i18n="live.end"></button>
        </div>
        <p id="live-message" class="message" role="status" aria-live="polite"></p>
      </header>

      <div class="live-grid">
        <section class="live-current" aria-labelledby="current-heading">
          <h2 id="current-heading" class="sr-only" data-i18n="live.currentHeading"></h2>
          <div id="current"></div>
          <div class="live-nav" role="group" data-i18n-aria-label="live.navLabel">
            <button type="button" class="secondary" id="prev-button" data-i18n="live.prev"></button>
            <button type="button" id="next-button"></button>
          </div>
          <p class="hint key-hint" data-i18n="live.keyHint"></p>
        </section>

        <section class="live-setlist" aria-labelledby="setlist-heading">
          <h2 id="setlist-heading" data-i18n="live.setlistHeading"></h2>
          <ol id="setlist" class="live-list"></ol>
        </section>

        <aside class="live-info" aria-labelledby="info-heading">
          <h2 id="info-heading" data-i18n="live.infoHeading"></h2>
          <div id="info"></div>
        </aside>
      </div>
    </div>

    <dialog id="end-dialog" aria-labelledby="end-heading">
      <form method="dialog">
        <h2 id="end-heading" data-i18n="live.endHeading"></h2>
        <p data-i18n="live.endText"></p>
        <div class="form-actions">
          <button type="submit" class="danger" value="end" data-i18n="live.endConfirm"></button>
          <button type="submit" class="secondary" value="cancel" data-i18n="live.endCancel"></button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/chords.js"></script>
  <script src="/sections.js"></script>
  <script src="/page.js"></script>
  <script src="/song-render.js"></script>
  <script src="/live-client.js"></script>
  <script src="/live.js"></script>
</body>
</html>
