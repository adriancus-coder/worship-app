<!doctype html>
<html lang="{{LANG}}" data-app-name="{{APP_NAME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <title>{{APP_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-shell="more" class="list-page">
  <main class="wide">
    <h1 data-i18n="media.heading"></h1>
    <p class="muted" id="media-usage"></p>

    <!-- The upload forms and the library scroll here; the title and usage stay. -->
    <div class="media-pane" data-list-pane="media.listHeading">
      <section class="pair-form media-form" aria-labelledby="upload-heading">
        <h2 id="upload-heading" data-i18n="media.uploadHeading"></h2>
        <p class="hint" id="upload-hint"></p>
        <label class="button file-button" data-icon="upload">
          <span data-i18n="media.chooseFile"></span>
          <input type="file" id="upload-file" accept="video/mp4,video/webm" class="sr-only">
        </label>
        <div class="upload-progress" id="upload-progress" hidden>
          <span id="upload-name"></span>
          <progress id="upload-bar" max="100" value="0"></progress>
          <span id="upload-percent" aria-live="polite"></span>
        </div>
        <p id="upload-message" class="message" role="status" aria-live="polite"></p>
      </section>

      <section class="pair-form media-form" aria-labelledby="bg-heading">
        <h2 id="bg-heading" data-i18n="media.bgHeading"></h2>
        <p class="hint" id="bg-hint"></p>
        <label class="button secondary file-button" data-icon="upload">
          <span data-i18n="media.bgChoose"></span>
          <input type="file" id="bg-file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" class="sr-only">
        </label>
        <div class="upload-progress" id="bg-progress" hidden>
          <span id="bg-name"></span>
          <progress id="bg-bar" max="100" value="0"></progress>
          <span id="bg-percent" aria-live="polite"></span>
        </div>
        <p id="bg-message" class="message" role="status" aria-live="polite"></p>
        <!-- "Din link": the server fetches an https image / video and stores it like an upload. -->
        <form id="bg-url-form" class="bg-url-form" novalidate>
          <h3 class="bg-url-heading" data-i18n="media.bgFromLink"></h3>
          <p class="hint" data-i18n="media.bgUrlHint"></p>
          <div class="input-row">
            <label for="bg-url" class="sr-only" data-i18n="media.bgUrlLabel"></label>
            <input type="url" id="bg-url" maxlength="2000" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://" required>
            <button type="submit" class="secondary" id="bg-url-submit" data-icon="link" data-i18n="media.bgUrlSubmit"></button>
          </div>
          <p id="bg-url-message" class="message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <form class="pair-form media-form" id="url-form" novalidate aria-labelledby="url-heading">
        <h2 id="url-heading" data-i18n="media.urlHeading"></h2>
        <p class="hint" data-i18n="media.urlHint"></p>
        <div class="pair-fields">
          <label><span data-i18n="media.titleLabel"></span><input type="text" id="url-title" maxlength="120" required></label>
          <label><span data-i18n="media.urlLabel"></span><input type="url" id="url-value" maxlength="500" inputmode="url" autocapitalize="off" spellcheck="false" required></label>
        </div>
        <button type="submit" class="secondary" data-icon="link" data-i18n="media.urlSubmit"></button>
        <p id="url-message" class="message" role="status" aria-live="polite"></p>
      </form>

      <!-- "Caută pe Pexels" (lib/pexels.js): shown only when the server has PEXELS_API_KEY. -->
      <section class="pair-form media-form pexels-section" id="pexels-section" aria-labelledby="pexels-heading" hidden>
        <h2 id="pexels-heading" data-i18n="media.pexelsHeading"></h2>
        <p class="hint" data-i18n="media.pexelsHint"></p>
        <form id="pexels-form" class="pexels-form" novalidate>
          <div class="input-row search-row">
            <label for="pexels-q" class="sr-only" data-i18n="media.pexelsSearchLabel"></label>
            <input type="search" id="pexels-q" maxlength="80" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button type="submit" class="secondary" id="pexels-search" data-icon="search" data-i18n="media.pexelsSearch"></button>
          </div>
        </form>
        <div class="pexels-tools">
          <div class="pexels-suggestions" id="pexels-suggestions" role="group" data-i18n-aria-label="media.pexelsSuggestions"></div>
          <div class="choice-group pexels-kind" role="group" data-i18n-aria-label="media.pexelsKindLabel">
            <button type="button" data-kind="photos" aria-pressed="true" data-i18n="media.pexelsPhotos"></button>
            <button type="button" data-kind="videos" aria-pressed="false" data-i18n="media.pexelsVideos"></button>
          </div>
        </div>
        <p id="pexels-status" class="muted" role="status" aria-live="polite"></p>
        <p id="pexels-message" class="message" role="status" aria-live="polite"></p>
        <ul id="pexels-grid" class="pexels-grid"></ul>
      </section>

      <div class="pane-heading media-list-head">
        <h2 id="list-heading" data-i18n="media.listHeading"></h2>
        <div class="choice-group media-filters" role="group" data-i18n-aria-label="media.filterLabel">
          <button type="button" data-filter="all" aria-pressed="true" data-i18n="media.filters.all"></button>
          <button type="button" data-filter="video" aria-pressed="false" data-i18n="media.filters.video"></button>
          <button type="button" data-filter="background" aria-pressed="false" data-i18n="media.filters.background"></button>
        </div>
      </div>
      <p id="status" class="muted pane-state" role="status" aria-live="polite" data-i18n="events.loading"></p>
      <ul id="media-list" class="screen-list"></ul>
    </div>

    <dialog id="rename-dialog" aria-labelledby="rename-heading">
      <form method="dialog" id="rename-form">
        <h2 id="rename-heading" data-i18n="media.renameHeading"></h2>
        <label><span data-i18n="media.titleLabel"></span><input type="text" id="rename-title" maxlength="120" required></label>
        <p id="rename-message" class="message error" role="alert"></p>
        <div class="form-actions">
          <button type="submit" value="save" data-icon="check" data-i18n="screens.renameSave"></button>
          <button type="button" class="secondary" id="rename-cancel" data-i18n="screens.cancel"></button>
        </div>
      </form>
    </dialog>

    <dialog id="delete-dialog" aria-labelledby="delete-heading">
      <form method="dialog">
        <h2 id="delete-heading" data-i18n="media.deleteHeading"></h2>
        <p id="delete-text"></p>
        <div class="form-actions">
          <button type="submit" class="danger" value="delete" data-i18n="media.deleteConfirm"></button>
          <button type="submit" class="secondary" value="cancel" data-i18n="screens.cancel"></button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="/i18n.js"></script>
  <script src="/page.js"></script>
  <script src="/list-pane.js"></script>
  <script src="/shell.js"></script>
  <script src="/media.js"></script>
</body>
</html>
